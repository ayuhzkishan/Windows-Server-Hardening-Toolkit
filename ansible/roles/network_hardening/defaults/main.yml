---
# Default variables for the network_hardening role.
# All controls are enabled by default.
# Override per-host in host_vars/ if a control must be excluded.

# CIS 18.5.4.1 - 0 = LLMNR disabled
llmnr_enable_multicast: 0

# CIS 18.5.5.1 - 2 = P-Node (no broadcasts)
netbios_node_type: 2

# CIS 18.5.14.1 - 0 = WDigest disabled
wdigest_use_logon_credential: 0

# CIS 18.9.97.2 - 1 = LSA Protection enabled
lsa_run_as_ppl: 1

# CIS 18.5.8.1 - 1 = SMB signing required
smb_require_security_signature: 1
smb_enable_security_signature: 1

# CIS 18.6.1 - 255 = all IPv6 components disabled
ipv6_disabled_components: 255
